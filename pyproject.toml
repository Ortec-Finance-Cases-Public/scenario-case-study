[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casestudy"
version = "0.1.0"
description = "Starter code for the synthetic macro-financial scenario case study"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
